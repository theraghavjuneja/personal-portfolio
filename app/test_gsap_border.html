<!DOCTYPE html>
<html>
<head>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <style>
    body { background: #eee; height: 100vh; margin: 0; display: flex; align-items: center; justify-content: center; }
    .cursor {
      width: 50px; height: 50px; background: teal; border: 4px solid black; box-shadow: 4px 4px 0 black;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="cursor" id="cursor"></div>
  <script>
    gsap.to("#cursor", {
      borderRadius: "40% 60% 70% 30% / 40% 50% 60% 50%",
      duration: 1,
      repeat: -1,
      yoyo: true,
      ease: "sine.inOut"
    });
  </script>
</body>
</html>
